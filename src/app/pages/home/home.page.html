<section>
  <section class="swiper">
    <swiper-container
      class="swiper__container"
      slides-per-view="1"
      autoplay="true"
      centeredSlides="true"
      [initialSlide]="1"
      navigation
      pagination
      loop
    >
      @for (slide of images(); track $index) {
      <swiper-slide class="swiper__container__slide">
          <app-custom-image
            [imageSrc]="slide"
            [altText]="'Image slide-' + $index"
            class="swiper__container__slide__image"
          />
      </swiper-slide>
      }
    </swiper-container>
  </section>
</section>
